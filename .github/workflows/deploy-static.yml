name: deploy static site

on:
  push:
    branches: [main]
    paths: ["static-site/**", ".github/workflows/deploy-static.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN is not set, so this run only checks out the code"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy static site
        if: steps.creds.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config static-site/wrangler.jsonc
